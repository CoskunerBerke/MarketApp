name: Market Veri Güncelleme (BİM + ŞOK + Migros)

on:
  schedule:
    # Türkiye saati (UTC+3): 06:00, 10:00, 15:00, 21:00
    - cron: '0 3 * * *'
    - cron: '0 7 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Wake up Render server
        run: |
          echo "Waking up Render free tier server..."
          curl -s -o /dev/null -w "Status: %{http_code}" https://market-backend-oozv.onrender.com/api/system/health || true
          echo ""
          echo "Waiting 30s for server to fully wake up..."
          sleep 30
          curl -s https://market-backend-oozv.onrender.com/api/system/health
          echo ""

      - name: Scrape BİM (attempt 1)
        id: bim1
        run: node scripts/scrape-bim.js
        continue-on-error: true

      - name: Scrape BİM (attempt 2 - retry)
        if: steps.bim1.outcome == 'failure'
        id: bim2
        run: |
          echo "Retry for BIM..."
          sleep 10
          node scripts/scrape-bim.js
        continue-on-error: true

      - name: Wait between markets
        run: sleep 5

      - name: Scrape ŞOK (attempt 1)
        id: sok1
        run: node scripts/scrape-sok.js
        continue-on-error: true

      - name: Scrape ŞOK (attempt 2 - retry)
        if: steps.sok1.outcome == 'failure'
        id: sok2
        run: |
          echo "Retry for SOK..."
          sleep 10
          node scripts/scrape-sok.js
        continue-on-error: true

      - name: Wait between markets
        run: sleep 5

      - name: Scrape Migros (attempt 1)
        id: migros1
        run: node scripts/scrape-migros.js
        continue-on-error: true

      - name: Scrape Migros (attempt 2 - retry)
        if: steps.migros1.outcome == 'failure'
        id: migros2
        run: |
          echo "Retry for Migros..."
          sleep 10
          node scripts/scrape-migros.js
        continue-on-error: true

      - name: Check results
        run: |
          BIM_OK=false
          SOK_OK=false
          MIGROS_OK=false
          
          if [ "${{ steps.bim1.outcome }}" == "success" ] || [ "${{ steps.bim2.outcome }}" == "success" ]; then
            BIM_OK=true
          fi
          
          if [ "${{ steps.sok1.outcome }}" == "success" ] || [ "${{ steps.sok2.outcome }}" == "success" ]; then
            SOK_OK=true
          fi
          
          if [ "${{ steps.migros1.outcome }}" == "success" ] || [ "${{ steps.migros2.outcome }}" == "success" ]; then
            MIGROS_OK=true
          fi
          
          echo "=============================="
          echo "BİM:    $([ "$BIM_OK" = true ] && echo '✅ SUCCESS' || echo '❌ FAILED')"
          echo "ŞOK:    $([ "$SOK_OK" = true ] && echo '✅ SUCCESS' || echo '❌ FAILED')"
          echo "Migros: $([ "$MIGROS_OK" = true ] && echo '✅ SUCCESS' || echo '❌ FAILED')"
          echo "=============================="
          
          if [ "$BIM_OK" = false ] && [ "$SOK_OK" = false ] && [ "$MIGROS_OK" = false ]; then
            echo "CRITICAL: All markets failed!"
            exit 1
          fi
