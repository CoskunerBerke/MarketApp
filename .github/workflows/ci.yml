name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-api:
    name: API, web client and admin (build, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Database for the API integration tests (test data only, no secrets).
      TEST_MONGODB_URI: mongodb://localhost:27017

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (includes type checking)
        run: pnpm -r run build

      - name: Type-check API tests
        run: pnpm --filter @market/server run typecheck

      - name: Lint web client and admin
        run: pnpm -r run lint

      - name: Test (API + scraper helpers)
        run: pnpm test

  mobile:
    name: Mobile app (type check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit
