name: ŞOK Market Scraper

on:
  schedule:
    # Her gün saat 06:00 ve 18:00 (UTC) = 09:00 ve 21:00 (Türkiye saati)
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  scrape-sok:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Scrape ŞOK and push to API
        run: node scripts/scrape-sok.js
